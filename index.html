<div class="login-panel"><form class="login-form" onsubmit="event.preventDefault();confirmLogin()"><div class="login-kicker">STRATEGY WORKSPACE</div><h2>欢迎回到研究工作台</h2><p>登录你的账号，开启今天的研究。</p><label for="login-name">账号</label><input id="login-name" placeholder="请输入账号" maxlength="50" autocomplete="username" required aria-describedby="login-error login-note"><label for="login-password">密码</label><input id="login-password" type="password" placeholder="请输入密码" maxlength="256" autocomplete="current-password" required><button class="login-submit" type="submit">登录并进入工作台　→</button><p class="login-error" id="login-error" role="alert"></p><div class="login-divider"><div class="login-note" id="login-note">默认账号：admin　默认密码：admin<br>本地账号验证，新增资产自动记录当前登录人。</div><div class="login-status"><i></i>离线运行 · 数据本地保存</div></div></form></div></section><aside><div class="brand">航策 <small>AERO STRATEGY / KNOWLEDGE</small></div><div class="nav" id="nav"></div><div class="sidefoot">战略研究工作空间<br>● <span id="dbstatus">SQLite · 本机数据库</span><br><span style="color:#7084a0">让每一次研究成为下一次的起点</span></div></aside><main><header><div>战略研究 / <b id="crumb">知识总览</b></div><div class="row"><span class="subtle">商用航空发动机 · 战略团队</span><button class="btn" id="current-user" onclick="logout()">登录</button></div></header><div class="wrap" id="app"></div></main><dialog id="modal"></dialog><div id="toast" class="toast hidden"></div>
<script>
(async function(){
let initial={assets:[],templates:[],token:''};

const pages=['知识总览','素材与数据','研究模板','报告工作台','拆解与整理','维护与质量'];const icons=['◫','▤','▦','✧','⇄','◎'];let page=0,filter='全部',query='',selected=new Set(),draft='';const key='aero-knowledge-v1';
let records=[],templates=[],currentUser='';
let cloudResizeObserver;
function drawWordCloud(){
 const cloud=document.querySelector('#word-cloud');const width=cloud.clientWidth,height=cloud.clientHeight;if(!width||!height)return;
 const frequencies=new Map();const add=(word,weight=1)=>{if(word)frequencies.set(word,(frequencies.get(word)||0)+weight)};
 ['战略研究','知识资产','航空发动机','组织绩效','市场洞察','研究模板','产业政策','国际合作','证据溯源','企业对标','研发制造','服务运营','决策支持','知识沉淀','研究方法','数据口径','报告草稿','产业金融','供应链','创新','协同','洞见'].forEach(w=>add(w));
 records.forEach(r=>{add(r.tag,3);add(r.domain,2);add(r.type)});add('战略研究',5);add('知识资产',4);
 const words=[...frequencies].sort((a,b)=>b[1]-a[1]);const max=words[0][1];const placed=[];const fragment=document.createDocumentFragment();const ctx=document.createElement('canvas').getContext('2d');const colors=['#dceee9','#9fcac7','#72aab9','#63909f','#b2cbd3'];
 words.forEach(([word,count],index)=>{let size=Math.round((height<240?12:15)+(count/max)*(height<240?15:27));ctx.font=`600 ${size}px system-ui`;const w=ctx.measureText(word).width+14,h=size+12;if(w>width)return;
 for(let step=0;step<1600;step++){const angle=step*.29,radius=step*.38;const x=width/2+Math.cos(angle)*radius-w/2,y=height/2+Math.sin(angle)*radius*.68-h/2;if(x<0||y<0||x+w>width||y+h>height||placed.some(p=>x<p.x+p.w&&x+w>p.x&&y<p.y+p.h&&y+h>p.y))continue;
 const span=document.createElement('span');span.className='cloud-word';span.textContent=word;Object.assign(span.style,{left:`${x+7}px`,top:`${y+6}px`,fontSize:`${size}px`,color:colors[index%colors.length],animationDelay:`-${index*.7}s`,animationDuration:`${7+index%5}s`});fragment.append(span);placed.push({x,y,w,h});break;}
 });cloud.replaceChildren(fragment);
}
function login(){
 document.querySelector('#modal').close();
 document.querySelector('#login-screen').classList.remove('hidden');
 document.querySelector('aside').inert=true;document.querySelector('main').inert=true;
 document.querySelector('#login-password').value='';document.querySelector('#login-error').textContent='';
 drawWordCloud();
 if(!cloudResizeObserver){cloudResizeObserver=new ResizeObserver(()=>drawWordCloud());cloudResizeObserver.observe(document.querySelector('#word-cloud'))}
 document.querySelector('#login-name').focus();
}
async function loadWorkspace(user){
 const res=await fetch('/api/state',{cache:'no-store'});const state=await res.json();
 if(!res.ok)throw Error(state.error||'读取数据失败');
 initial=state;records=state.assets;templates=state.templates;currentUser=user;
 document.querySelector('#login-screen').classList.add('hidden');
 document.querySelector('aside').inert=false;document.querySelector('main').inert=false;
 document.querySelector('#current-user').textContent=user+' · 退出登录';
 document.querySelector('#login-password').value='';
 history.replaceState(null,'',location.pathname);render();
 document.querySelector('#current-user').focus();
}
async function confirmLogin(){
 const button=document.querySelector('.login-submit');
 if(location.protocol==='file:'){document.querySelector('#login-error').textContent='请先双击 start.bat（Mac/Linux 用 start.command），不要直接双击 HTML。';return}
 const username=document.querySelector('#login-name').value.trim(),password=document.querySelector('#login-password').value;
 if(!username||!password){document.querySelector('#login-error').textContent='请输入账号和密码';return}
 button.disabled=true;button.textContent='正在登录…';
 try{
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const result=await res.json();if(!res.ok)throw Error(result.error||'登录失败');
  await loadWorkspace(result.user);
 }catch(e){document.querySelector('#login-error').textContent=e instanceof TypeError?'无法连接本地服务，请使用启动脚本打开页面。':e.message}
 finally{button.disabled=false;button.textContent='登录并进入工作台　→'}
}
async function logout(){
 await writes;
 try{
  const res=await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body:'{}'});
  if(!res.ok&&res.status!==401)throw Error('退出登录失败，请重试');
  currentUser='';records=[];templates=[];selected.clear();draft='';page=0;
  document.querySelector('#app').replaceChildren();document.querySelector('#nav').replaceChildren();
  login();document.querySelector('#current-user').textContent='登录';
 }catch(e){alert(e.message)}
}
async function suggestEditorTag(){const res=await fetch('/api/tag',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body:JSON.stringify({title:document.querySelector('#et').value,content:document.querySelector('#ec').value,domain:document.querySelector('#ed').value})});const data=await res.json();if(!res.ok)throw Error(data.error);return data.tag}
async function refreshTag(){try{document.querySelector('#etag').value=await suggestEditorTag();document.querySelector('#etag').dataset.source='offline_rule';toast('已生成离线规则建议，可继续修改')}catch(e){toast(e.message)}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let writes=Promise.resolve();function save(){document.querySelector('#dbstatus').textContent='● 正在保存…';const body=JSON.stringify({assets:records,templates});writes=writes.then(async()=>{try{const res=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body});if(!res.ok){const d=await res.json();throw Error(d.error||'保存失败')}const canonical=await (await fetch('/api/state')).json();if(body===JSON.stringify({assets:records,templates})){records=canonical.assets;render()}document.querySelector('#dbstatus').textContent='● SQLite 已保存';return true}catch(e){document.querySelector('#dbstatus').textContent='● 保存失败，请导出备份';alert('数据库保存失败：'+e.message+'。请保持页面打开并导出资产备份。');return false}});return writes}window.addEventListener('beforeunload',()=>{});function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}function go(n){page=n;query='';filter='全部';render()}function opts(arr){return arr.map(x=>`<option>${esc(x)}</option>`).join('')}const domains=['产业与市场','企业与竞争','战略与组织','政策与金融','国际合作'];function title(k,t,sub,act=''){return `<div class="topline"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${sub}</p></div>${act}</div>`}function card(r){return `<div class="card"><div class="row"><div><span class="tag">${esc(r.domain)}</span><span class="tag ${r.status==='已审核'?'green':'amber'}">${esc(r.status)}</span></div><label style="margin:0"><input type="checkbox" style="width:auto" ${selected.has(r.id)?'checked':''} onchange="toggle(${r.id},this.checked)"> 加入研究</label></div><h3 style="margin-top:14px"><button class="link" onclick="detail(${r.id})">${esc(r.title)}</button></h3><p>${esc(r.content)}</p><div class="meta">${esc(r.kind)} · ${esc(r.type)} · ${esc(r.source)} · ${esc(r.date)} · 负责人：${esc(r.owner||'待指定')} · 标签：${esc(r.tag| function importCsv(){
 if(!currentUser)return login();pendingCsvAssets=[];csvPreviewVersion++;
 modal(`<h2>CSV批量导入素材</h2><p>先下载模板，填写后选择文件。标题、正文和来源为必填；空白标签自动生成离线规则建议。</p><p>确认后追加素材，负责人统一记录当前登录人 ${esc(currentUser)}，不使用CSV中的负责人和编号。重复导入会追加重复素材。</p><button class="btn" onclick="downloadCsvTemplate()">下载CSV模板</button><label for="csv-file">选择CSV文件（支持UTF-8、Excel常见中文编码）</label><input id="csv-file" type="file" accept=".csv" onchange="previewCsv(this)"><p id="csv-error" role="alert" style="color:#b34b39"></p><div id="csv-preview"></div><button class="btn primary" id="csv-confirm" disabled onclick="applyCsv()">确认导入</button>`)
}
async function readCsvFile(file){
 if(file.size>8*1024*1024)throw Error('CSV文件请控制在8MB以内');
 const bytes=await file.arrayBuffer();
 try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){return new TextDecoder('gb18030',{fatal:true}).decode(bytes)}
}
async function requestCsvPreview(file,restore=false){
 const csv=await readCsvFile(file);
 const res=await fetch('/api/csv/preview',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body:JSON.stringify({csv,restore})});
 const result=await res.json();if(!res.ok)throw Error(result.error);return result.assets;
}
async function previewCsv(input){
 const version=++csvPreviewVersion;pendingCsvAssets=[];document.querySelector('#csv-confirm').disabled=true;document.querySelector('#csv-preview').replaceChildren();document.querySelector('#csv-error').textContent='';
 if(!input.files[0])return;
 try{
  const assets=await requestCsvPreview(input.files[0]);if(version!==csvPreviewVersion)return;pendingCsvAssets=assets;
  document.querySelector('#csv-preview').innerHTML=`<p>校验通过，共 ${assets.length} 条素材。以下预览前10条：</p><div style="overflow:auto"><table><thead><tr><th>标题</th><th>正文摘要</th><th>来源</th><th>标签</th><th>负责人</th></tr></thead><tbody>${assets.slice(0,10).map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.content.slice(0,60))}</td><td>${esc(r.source)}</td><td>${esc(r.tag)}</td><td>${esc(r.owner)}</td></tr>`).join('')}</tbody></table></div>`;
  document.querySelector('#csv-confirm').disabled=false;
 }catch(e){if(version===csvPreviewVersion)document.querySelector('#csv-error').textContent='校验未通过，未导入任何数据：'+e.message}
}
async function applyCsv(){
 if(!pendingCsvAssets.length)return;const batch=pendingCsvAssets;const previous=records;
 document.querySelector('#csv-confirm').disabled=true;records=[...batch,...records];
 if(await save()){pendingCsvAssets=[];document.querySelector('#modal').close();render();toast(`已导入 ${batch.length} 条素材`)}else{records=previous;document.querySelector('#csv-confirm').disabled=false}
}
function restoreFile(){
 if(!currentUser)return login();const input=document.createElement('input');input.type='file';input.accept='.csv,.json';
 input.onchange=async()=>{
  if(!input.files[0])return;
  try{
   const file=input.files[0],isCsv=file.name.toLowerCase().endsWith('.csv');
   const b=isCsv?{assets:await requestCsvPreview(file,true),templates}:JSON.parse(await file.text());
   if(!Array.isArray(b.assets)||!Array.isArray(b.templates))throw Error('备份格式不正确');
   if(!confirm(isCsv?'恢复CSV将替换全部现有素材，模板保持不变。建议先导出当前素材备份。继续？':'恢复旧JSON将替换全部素材和模板。建议先备份。继续？'))return;
   await writes;
   const res=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body:JSON.stringify(b)});
   const result=await res.json();if(!res.ok)throw Error(result.error);
   const restored=await(await fetch('/api/state',{cache:'no-store'})).json();records=restored.assets;templates=restored.templates;selected.clear();render();toast('备份已恢复');
  }catch(e){alert('导入失败：'+e.message)}
 };input.click();
}

Object.assign(window,{downloadCsvTemplate,importCsv,previewCsv,applyCsv,login,confirmLogin,logout,refreshTag,backup,card,detail,download,edit,generate,go,ingest,list,modal,newTemplate,optim,opts,readFile,render,restoreFile,saveEdit,saveTpl,search,setfilter,split,title,toast,toggle});
for(const [k,g,s]of [['selected',()=>selected,v=>selected=v],['draft',()=>draft,v=>draft=v]])Object.defineProperty(window,k,{get:g,set:s});
login();
if(location.protocol==='file:'){
 document.querySelector('#login-error').textContent='请先双击 start.bat（Mac/Linux 用 start.command），不要直接双击 HTML。';
}else{
 try{
  const res=await fetch('/api/session',{cache:'no-store'});
  if(res.ok){
   const session=await res.json();
   if(new URLSearchParams(location.search).has('login')){
    await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':session.token},body:'{}'});
   }else await loadWorkspace(session.user);
  }
 }catch(e){document.querySelector('#login-error').textContent='无法连接本地服务，请重新运行启动脚本。'}
}
})();
</script></html>
