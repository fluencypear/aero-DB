const seed=[{id:1,title:'商用航发全生命周期：从产品交付到服务运营',domain:'产业与市场',type:'行业研究',content:'研究商用航空发动机企业，应同时覆盖产品研发、产业化交付与在役服务三个环节。分析框架可分别考察产品竞争力、交付保障能力和客户服务能力，并说明各环节之间的资源与能力衔接。',source:'示例素材 · 分析框架',status:'已审核',date:'2026-10-08',kind:'段落素材'},{id:2,title:'国际标杆企业组织模式对比框架',domain:'企业与竞争',type:'对标研究',content:'对GE Aerospace、Rolls-Royce与Pratt & Whitney的组织研究，可按业务边界、研发与制造协同、服务运营机制、合作伙伴管理和绩效责任划分等维度展开。具体组织事实需根据企业公开文件逐项核验。',source:'示例素材 · 对标方法',status:'已审核',date:'2026-10-09',kind:'段落素材'},{id:3,title:'从研发向小批产转型的组织绩效关注点',domain:'战略与组织',type:'专题研究',content:'小批产阶段的绩效设计应将研发节点与交付结果衔接，补充质量一致性、生产计划达成、供应链保障和问题闭环等维度。维修中心可单独建立服务响应、维修周期和能力建设指标。',source:'示例素材 · 待验证研究假设',status:'待审核',date:'2026-10-10',kind:'段落素材'},{id:4,title:'产业金融政策研究数据清单',domain:'政策与金融',type:'政策研究',content:'建议采集政策名称、发布机构、适用主体、支持方式、实施期限、资金来源、申报条件及原文出处。政策有效性和适用范围应在使用前复核。',source:'示例数据 · 字段定义',status:'待更新',date:'2026-09-01',kind:'战略数据'},{id:5,title:'航空发动机市场指标口径表',domain:'产业与市场',type:'行业研究',content:'市场数据应区分订单、交付量、在役数量、收入与市场份额，注明年份、产品范围、统计单位和是否包含合资企业。不同口径的数据不可直接合并。',source:'示例数据 · 指标口径',status:'已审核',date:'2026-10-07',kind:'战略数据'},{id:6,title:'国际合作项目评估维度',domain:'国际合作',type:'专题研究',content:'国际合作项目可从战略匹配、能力互补、职责划分、成果归属、投入机制和退出安排等维度分析。结论应区分已确认条款、谈判假设与待补充信息。',source:'示例素材 · 评估框架',status:'待审核',date:'2026-10-11',kind:'段落素材'}];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let writes=Promise.resolve();function save(){document.querySelector('#dbstatus').textContent='● 正在保存…';const body=JSON.stringify({assets:records,templates});writes=writes.then(async()=>{try{const res=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body});if(!res.ok){const d=await res.json();throw Error(d.error||'保存失败')}document.querySelector('#dbstatus').textContent='● SQLite 已保存'}catch(e){document.querySelector('#dbstatus').textContent='● 保存失败，请导出备份';alert('数据库保存失败：'+e.message+'。请保持页面打开并导出资产备份。')}})}window.addEventListener('beforeunload',()=>{});function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}function go(n){page=n;query='';filter='全部';render()}function opts(arr){return arr.map(x=>`<option>${esc(x)}</option>`).join('')}const domains=['产业与市场','企业与竞争','战略与组织','政策与金融','国际合作'];function title(k,t,sub,act=''){return `<div class="topline"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${sub}</p></div>${act}</div>`}function card(r){return `<div class="card"><div class="row"><div><span class="tag">${esc(r.domain)}</span><span class="tag ${r.status==='已审核'?'green':'amber'}">${esc(r.status)}</span></div><label style="margin:0"><input type="checkbox" style="width:auto" ${selected.has(r.id)?'checked':''} onchange="toggle(${r.id},this.checked)"> 加入研究</label></div><h3 style="margin-top:14px"><button class="link" onclick="detail(${r.id})">${esc(r.title)}</button></h3><p>${esc(r.content)}</p><div class="meta">${esc(r.kind)} · ${esc(r.type)} · ${esc(r.source)} · ${esc(r.date)}</div></div>`}function toggle(id,v){v?selected.add(id):selected.delete(id);toast(`已选 ${selected.size} 项研究素材`)}
function render(){document.querySelector('#nav').innerHTML=pages.map((p,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${icons[i]}　${p}</button>`).join('');document.querySelector('#crumb').textContent=pages[page];const a=document.querySelector('#app');if(page===0){a.innerHTML=title('STRATEGY INTELLIGENCE','知识总览','沉淀研究资产，连接问题、证据与决策。',`<button class="btn primary" onclick="go(3)">＋ 开始一项研究</button>`)+`<div class="stats"><div class="stat">知识资产<strong>${records.length}</strong><em>段落素材与结构化数据</em></div><div class="stat">研究模板<strong>${templates.length}</strong><em>按工作产出组织</em></div><div class="stat">业务领域<strong>5</strong><em>覆盖战略团队核心业务</em></div><div class="stat">待处理资产<strong>${records.filter(r=>r.status!=='已审核').length}</strong><em>审核与时效性检查</em></div></div><div class="grid"><section><div class="panel"><div class="panelhead"><h2>知识资产</h2><button class="link" onclick="go(1)">浏览全部 →</button></div><div class="search"><span>⌕</span><input placeholder="搜索业务领域、企业、研究主题…" onkeydown="if(event.key==='Enter'){let v=this.value;go(1);document.querySelector('#search').value=v;search(v)}"><span class="subtle">Enter 检索</span></div><div class="chips">${domains.map(d=>`<button class="chip" onclick="go(1);setfilter('${d}')">${d}</button>`).join('')}</div>${records.slice(0,3).map(card).join('')}</div></section><section><div class="panel"><h2>研究快捷入口</h2><p class="subtle">从具体工作事项出发</p><button class="quick" onclick="go(3)">✧　生成研究报告<small>需求 → 模板 → 素材 → 草稿</small></button><button class="quick" onclick="go(2)">▦　优化课题模板<small>结构、产出要求与证据清单</small></button><button class="quick" onclick="go(4)">⇄　整理原始资料<small>段落拆解、标签与数据字段</small></button></div><div class="panel"><h3>资产组织方式</h3><p>业务领域 → 业务类型 → 产出要求 → 模板</p><div class="bar"><i style="width:75%"></i></div><p class="subtle">每条素材关联来源、口径、时间、审核状态与适用场景。</p></div><div class="notice">离线样机 · SQLite持久保存。内置示例资料，报告与模板按规则生成，尚未接入真实AI。</div></section></div>`}if(page===1){a.innerHTML=title('KNOWLEDGE ASSETS','素材与数据','按业务语境检索段落，保留来源和使用边界。',`<button class="btn primary" onclick="edit()">＋ 新增资产</button>`)+`<div class="panel"><div class="search">⌕ <input id="search" placeholder="搜索标题、正文、来源或业务类型" oninput="search(this.value)"></div><div id="filters" class="chips"></div><div class="row"><span id="count" class="subtle"></span><button class="btn" onclick="go(3)">使用已选素材（${selected.size}） →</button></div><div id="results"></div></div>`;list()}if(page===2){a.innerHTML=title('RESEARCH BLUEPRINTS','研究模板','把一次满意的研究成果，沉淀为可复用的工作方法。',`<button class="btn primary" onclick="newTemplate()">＋ 新建模板</button>`)+`<div class="grid"><section>${templates.map((t,i)=>`<div class="panel"><div class="row"><h2>${esc(t.name)}</h2><span class="tag green">V1.0</span></div><p>${esc(t.domain)} / ${esc(t.type)} / ${esc(t.audience)} / ${esc(t.length)}</p><div class="output">${esc(t.outline)}</div><div class="row" style="margin-top:18px"><button class="link" onclick="optim(${i})">优化并编辑模板 →</button><button class="btn" onclick="go(3);document.querySelector('#tpl').value=${i}">用于报告生成</button></div></div>`).join('')}</section><section><div class="panel"><h2>模板质量原则</h2><p>明确研究问题与读者。<br>定义各章节回答的问题。<br>列出证据和数据口径。<br>区分事实、推断与建议。<br>说明建议的适用条件。</p></div><div class="notice">模板优化为规则建议，可编辑后保存。未来可接入企业AI，对优秀成果反向提取结构与表达要求。</div></section></div>`}if(page===3){a.innerHTML=title('RESEARCH WORKBENCH','报告工作台','从工作需求到可追溯的报告草稿。')+`<div class="flow"><span>01 定义工作</span>→<span>02 匹配模板</span>→<span>03 引用素材</span>→<span>04 生成与审阅</span></div><div class="grid"><div class="panel"><h2>本次研究要求</h2><label>工作事项 / 课题名称</label><input id="topic" placeholder="例如：小批产阶段组织绩效调整研究"><div class="formgrid"><div><label>研究模板</label><select id="tpl">${templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select></div><div><label>目标读者</label><select id="aud">${opts(['公司领导','部门领导','课题组','外部交流'])}</select></div></div><label>具体问题与产出要求</label><textarea id="req" placeholder="需要回答什么问题？希望输出什么结论？有哪些篇幅、时间范围和资料限制？"></textarea><label>选用知识资产（仅已审核素材进入草稿）</label>${records.map(r=>`<label style="font-size:13px"><input type="checkbox" style="width:auto" name="ref" value="${r.id}" ${selected.has(r.id)?'checked':''}> ${esc(r.title)} <span class="tag ${r.status==='已审核'?'green':'amber'}">${r.status}</span></label>`).join('')}<button class="btn primary" style="margin-top:20px" onclick="generate()">✧ 生成报告草稿</button><div id="draft"></div></div><div><div class="panel"><h2>生成与审核规则</h2><p>只引用已审核素材。<br>引用保留资产编号与出处。<br>缺少事实数据时标记待补充。<br>不自动编造市场数值。<br>结论须经研究人员复核。</p></div><div class="notice">原型采用模板与素材组合生成草稿，并非大模型推理。尚未接入企业AI、RAG检索及团队协作存储。</div></div></div>`}if(page===4){a.innerHTML=title('KNOWLEDGE PROCESSING','拆解与整理','将原始文字转为可审核、可检索、可复用的段落资产。')+`<div class="grid"><div class="panel"><h2>导入原始资料</h2><label>读取文本文件（.txt / .md）</label><input type="file" accept=".txt,.md" onchange="readFile(this)"><label>或粘贴原始文本</label><textarea id="raw" style="min-height:240px" placeholder="粘贴资料，以空行分隔段落。每条拆解结果均可在入库前修改。"></textarea><div class="formgrid"><div><label>原始来源 / 文件名 / 页码</label><input id="src" placeholder="例如：内部研究稿，第3页"></div><div><label>业务领域</label><select id="domain">${opts(domains)}</select></div></div><button class="btn primary" style="margin-top:20px" onclick="split()">拆解段落并预览</button><div id="splitout"></div></div><section><div class="panel"><h2>整理标准</h2><p>每个段落保留一个完整观点。<br>标题应概括内容与适用问题。<br>来源信息随段落保留。<br>数值需补齐单位、年份和口径。<br>新增资料默认进入待审核。</p></div><div class="notice">文本按空行拆分；标签由用户确认。复杂PDF、Word解析和自动语义拆解需后续接入。</div></section></div>`}if(page===5){a.innerHTML=title('ASSET GOVERNANCE','维护与质量','持续审核、更新与留痕，让知识资产保持可信。',`<div class="row"><button class="btn" onclick="restoreFile()">导入备份</button><button class="btn" onclick="backup()">导出资产备份</button></div>`)+`<div class="stats"><div class="stat">审核通过<strong>${records.filter(r=>r.status==='已审核').length}</strong><em>可用于报告生成</em></div><div class="stat">待审核<strong>${records.filter(r=>r.status==='待审核').length}</strong><em>需人工核验来源与内容</em></div><div class="stat">待更新<strong>${records.filter(r=>r.status==='待更新').length}</strong><em>使用前检查时效性</em></div><div class="stat">资产记录<strong>${records.length}</strong><em>可编辑与导出</em></div></div><div class="panel" style="overflow:auto"><table><thead><tr><th>资产名称</th><th>业务领域</th><th>更新时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${records.map(r=>`<tr><td>${esc(r.title)}</td><td>${r.domain}</td><td>${r.date}</td><td><span class="tag ${r.status==='已审核'?'green':'amber'}">${r.status}</span></td><td><button class="link" onclick="edit(${r.id})">编辑 / 审核</button></td></tr>`).join('')}</tbody></table></div><div class="notice">数据保存至 data/knowledge.db；每次修改前自动保留历史快照。可导出JSON备份并导入恢复。关闭服务后，复制data文件夹即可完整备份。生产版可补充团队权限与审核责任人。</div>`}}
function search(v){query=v;list()}function setfilter(v){filter=v;list()}function list(){document.querySelector('#filters').innerHTML=['全部',...domains].map(d=>`<button class="chip ${filter===d?'active':''}" onclick="setfilter('${d}')">${d}</button>`).join('');const rr=records.filter(r=>(filter==='全部'||r.domain===filter)&&[r.title,r.content,r.type,r.source].join(' ').toLowerCase().includes(query.toLowerCase()));document.querySelector('#count').textContent=`找到 ${rr.length} 条资产 · 点击标题查看详情`;document.querySelector('#results').innerHTML=rr.map(card).join('')||'<div class="empty">暂无匹配资产，请尝试其他关键词。</div>'}
function detail(id){const r=records.find(x=>x.id===id);modal(`<h2>${esc(r.title)}</h2><p>${r.domain} / ${r.type} / ${r.kind}</p><div class="output">${esc(r.content)}</div><p>来源：${esc(r.source)}<br>更新：${r.date} · 状态：${r.status}<br>资产编号：K-${r.id}</p><button class="btn primary" onclick="selected.add(${id});toast('已加入研究素材');document.querySelector('#modal').close()">加入研究素材</button> <button class="btn" onclick="edit(${id})">编辑</button>`)}function modal(s){const d=document.querySelector('#modal');d.innerHTML=`<div class="row" style="margin-bottom:15px"><span class="eyebrow">KNOWLEDGE ASSET</span><button class="link" onclick="document.querySelector('#modal').close()">关闭 ✕</button></div>`+s;if(!d.open)d.showModal()}
function edit(id){const r=records.find(x=>x.id===id)||{title:'',content:'',domain:domains[0],type:'专题研究',source:'',status:'待审核',kind:'段落素材'};modal(`<h2>${id?'编辑 / 审核资产':'新增知识资产'}</h2><label>标题</label><input id="et" value="${esc(r.title)}"><div class="formgrid"><div><label>业务领域</label><select id="ed">${opts(domains)}</select></div><div><label>业务类型</label><select id="ey">${opts(['专题研究','行业研究','对标研究','政策研究'])}</select></div><div><label>资产类型</label><select id="ek">${opts(['段落素材','战略数据'])}</select></div><div><label>审核状态</label><select id="es">${opts(['待审核','已审核','待更新'])}</select></div></div><label>内容</label><textarea id="ec">${esc(r.content)}</textarea><label>来源 / 页码 / 口径</label><input id="eo" value="${esc(r.source)}"><button class="btn primary" style="margin-top:20px" onclick="saveEdit(${id||0})">保存资产</button>`);for(const [i,v]of [['ed',r.domain],['ey',r.type],['ek',r.kind],['es',r.status]])document.getElementById(i).value=v}function saveEdit(id){const v=i=>document.getElementById(i).value.trim();if(!v('et')||!v('ec')||!v('eo'))return toast('请填写标题、内容和来源');const r={id:id||Date.now(),title:v('et'),content:v('ec'),source:v('eo'),domain:v('ed'),type:v('ey'),kind:v('ek'),status:v('es'),date:new Date().toISOString().slice(0,10)};id?records[records.findIndex(x=>x.id===id)]=r:records.unshift(r);save();document.querySelector('#modal').close();render();toast('资产已保存')}
function optim(i){const t=templates[i];modal(`<h2>优化模板 · ${esc(t.name)}</h2><div class="notice">建议：补充比较口径、证据清单、局限性及行动建议；避免章节只罗列信息。</div><label>模板名称</label><input id="tn" value="${esc(t.name)}"><label>章节与产出要求</label><textarea id="to" style="min-height:240px">${esc(t.outline+'\n\n证据要求：每项核心判断关联来源、日期与数据口径。\n结论要求：区分事实、推断、建议，并说明适用边界。\n附件：资料缺口与待核验事项清单。')}</textarea><button class="btn primary" onclick="saveTpl(${i})">保存优化结果</button>`)}function newTemplate(){templates.push({name:'新研究模板',domain:'战略与组织',type:'专题研究',audience:'部门领导',length:'自定义',outline:'一、研究问题\n二、证据与分析\n三、结论与建议'});optim(templates.length-1)}function saveTpl(i){const n=document.querySelector('#tn').value.trim(),o=document.querySelector('#to').value.trim();if(!n||!o)return toast('请填写模板名称与章节');templates[i].name=n;templates[i].outline=o;save();document.querySelector('#modal').close();render();toast('模板已保存')}
function generate(){const topic=document.querySelector('#topic').value.trim();if(!topic)return toast('请先填写工作事项');const t=templates[document.querySelector('#tpl').value],req=document.querySelector('#req').value.trim(),ids=[...document.querySelectorAll('[name=ref]:checked')].map(x=>Number(x.value)),rr=records.filter(r=>ids.includes(r.id)&&r.status==='已审核');draft=`${topic}\n（规则生成草稿 · 需人工复核）\n\n研究目的\n面向${document.querySelector('#aud').value}，围绕“${topic}”开展研究。\n产出要求：${req||'待补充具体研究问题、范围及篇幅要求。'}\n\n报告框架\n${t.outline}\n\n可引用的证据素材\n${rr.length?rr.map(r=>`[K-${r.id}] ${r.title}\n${r.content}\n来源：${r.source}；更新：${r.date}`).join('\n\n'):'暂无已审核素材，请补充可信资料。'}\n\n研究缺口与下一步\n1. 核验素材与本课题的相关性，补充适用范围。\n2. 补充具体企业事实、统计数据与原文出处。\n3. 围绕章节形成论证，明确结论、适用条件和建议。\n4. 未审核素材不纳入正文；本草稿不构成研究结论。`;document.querySelector('#draft').innerHTML=`<div class="row" style="margin-top:25px"><h2>草稿预览</h2><button class="btn" onclick="download(draft,'研究报告草稿.txt')">导出草稿</button></div><textarea id="draftedit" style="min-height:440px" oninput="draft=this.value">${esc(draft)}</textarea><p class="subtle">采用 ${rr.length} 条已审核资产，排除 ${ids.length-rr.length} 条未审核资产。草稿可直接编辑。</p>`;toast('报告框架与证据草稿已生成')}
async function readFile(el){if(el.files[0])document.querySelector('#raw').value=await el.files[0].text()}let parts=[];function split(){const raw=document.querySelector('#raw').value.trim();if(!raw)return toast('请先输入文本');if(!document.querySelector('#src').value.trim())return toast('请填写资料来源');parts=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);document.querySelector('#splitout').innerHTML=`<h3 style="margin-top:24px">拆解预览 · ${parts.length} 条</h3>${parts.map((p,i)=>`<label>段落 ${i+1} · 标题</label><input id="pt${i}" value="${esc(p.slice(0,30).replace(/\n/g,' '))}"><label>段落内容</label><textarea id="pc${i}">${esc(p)}</textarea>`).join('')}<button class="btn primary" style="margin-top:20px" onclick="ingest()">确认入库 · 待审核</button>`}function ingest(){const src=document.querySelector('#src').value.trim(),d=document.querySelector('#domain').value;const batch=parts.map((p,i)=>({id:Date.now()+i,title:document.querySelector('#pt'+i).value.trim(),content:document.querySelector('#pc'+i).value.trim(),source:src,domain:d,type:'专题研究',status:'待审核',date:new Date().toISOString().slice(0,10),kind:'段落素材'}));if(batch.some(r=>!r.title||!r.content))return toast('请补齐所有标题和内容');records.unshift(...batch);save();go(5);toast(`${batch.length} 条段落已入库，等待审核`)}function download(txt,name){const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function backup(){download(JSON.stringify({assets:records,templates},null,2),'战略知识资产备份.json')}function restoreFile(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const b=JSON.parse(await input.files[0].text());if(!Array.isArray(b.assets)||!Array.isArray(b.templates))throw Error('备份格式不正确');if(!confirm('导入将替换当前资产和模板，建议先导出当前备份。继续？'))return;const res=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':initial.token},body:JSON.stringify(b)});const d=await res.json();if(!res.ok)throw Error(d.error);records=b.assets;templates=b.templates;selected.clear();render();toast('备份已恢复')}catch(e){alert('导入失败：'+e.message)}};input.click()}

Object.assign(window,{backup,card,detail,download,edit,generate,go,ingest,list,modal,newTemplate,optim,opts,readFile,render,restoreFile,saveEdit,saveTpl,search,setfilter,split,title,toast,toggle});
for(const [k,g,s]of [['selected',()=>selected,v=>selected=v],['draft',()=>draft,v=>draft=v]])Object.defineProperty(window,k,{get:g,set:s});
render();
})();
</script></html>
